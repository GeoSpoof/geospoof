# Vulnerabilities reviewed and accepted, read by OSV-Scanner and by OpenSSF
# Scorecard's Vulnerabilities check. Every entry needs a reason and an expiry:
# when ignoreUntil passes, the advisory reappears and must be re-reviewed.
# OSV-Scanner reads only the osv-scanner.toml next to each lockfile, so this
# file covers package-lock.json and cdk/osv-scanner.toml covers cdk/.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-01
reason = """minimatch globparts amplification (DoS). Dev-only: eslint, \
typescript-eslint and web-ext. The vulnerable firstPhasePreProcess() runs only \
at optimizationLevel >= 2 (default 1); nothing here sets it, and the 3.x copies \
don't contain it. Patterns come from repo config, not users. Fixed only in \
minimatch 11 (breaking API), which no parent has adopted. Also dismissed as \
not_used in Dependabot. Re-check on expiry: drop this entry once eslint, \
typescript-eslint and web-ext move to minimatch 11."""

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-02-01
reason = """deepmerge mergeObject() prototype poisoning. Dev-only: web-ext -> \
addons-linter, which pins deepmerge exactly and only merges its own bundled \
schemas with literal objects, so no external input reaches it. No patched \
release exists. Also dismissed as tolerable_risk in Dependabot. Re-check on \
expiry: drop this entry once deepmerge ships a fix or addons-linter drops it."""
