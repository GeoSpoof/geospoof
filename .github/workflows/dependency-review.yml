name: Dependency review

# Gates PRs that add or change dependencies: blocks a pull request that would
# introduce a package with a known high+ severity vulnerability, BEFORE it
# merges. This complements Dependabot rather than duplicating it — Dependabot
# scans what is already on main and opens fix PRs reactively; this stops a bad
# dependency from getting in in the first place.
#
# PR-only: there is no dependency graph to diff on a plain push.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # post the review summary as a PR comment
    steps:
      # No checkout: on pull_request the action diffs the dependency graph
      # through the API, so there is nothing to clone.
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block on high+ severity vulnerabilities. Dependabot still catches
          # anything lower after merge; this gate is for the serious ones.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
