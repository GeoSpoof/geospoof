name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs for the ONE category where green CI is
# sufficient on its own: patch-level bumps of devDependencies (build tooling and
# test libraries). A patch is the lowest-blast-radius change, so "all checks
# pass" is a reasonable gate without a human reading the diff.
#
# Not zero-risk: build tools like esbuild write the bytes we ship, so a
# compromised patch could reach users. The defence is the 7-day cooldown in
# dependabot.yml. Malicious npm releases are typically caught and pulled within
# hours, well before Dependabot would propose them.
#
# DELIBERATELY NARROW. Everything else stays manual on purpose:
#   - runtime `dependencies` (anything here ships to users of a privacy
#     extension; a compromised-but-green minor should not reach them unreviewed)
#   - any minor or major update (behaviour can change; majors are where
#     fast-check v4 silently broke us despite passing install)
#   - github-actions bumps (we SHA-pin precisely so each action change is
#     consciously reviewed before it runs)
#
# Auto-merge does NOT bypass branch protection: the PR still cannot merge until
# the required `Build & Test` check passes. This workflow only sets the
# "merge when checks pass" flag; GitHub enforces the checks.
#
# WHY A GITHUB APP TOKEN, NOT GITHUB_TOKEN. GitHub starts no workflow runs for
# events caused by GITHUB_TOKEN, and that includes the merge GitHub performs
# later on behalf of whoever turned auto-merge on. With GITHUB_TOKEN the merge
# commit reached main with no CI run, and geospoof-ios's build refuses an
# extension commit without a passing `Build & Test` (2026-11-23, #245). The
# "GeoSpoof Auto-merge" App's token makes the merge an ordinary push to main.
#   - AUTOMERGE_APP_CLIENT_ID is a repository variable (not secret).
#   - AUTOMERGE_APP_PRIVATE_KEY is a DEPENDABOT secret: a run started by a
#     Dependabot PR can read only Dependabot secrets, never Actions secrets.
#   - The App is installed on this repo only, with Contents + Pull requests
#     write, and must never be a ruleset bypass actor.
#   - The token is minted only for a PR that passes the policy below, narrowed
#     to the two permissions the merge needs, and revoked when the job ends.

on: pull_request

# Read-only throughout. The write access the merge needs comes from the App's
# short-lived token, not from GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  auto-merge:
    # Only react to PRs Dependabot opened. `github.actor` is whoever triggered
    # this run, which can be Dependabot on a PR someone else opened (e.g. after
    # a rebase), so check the PR's author instead. This is GitHub's documented
    # pattern.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # fetch-metadata reads the PR's commits
      pull-requests: read
    steps:
      - name: Classify the update
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Root only: CDK CI is path-filtered, so it can't be a required check and
      # "green" on a cdk/ PR wouldn't include it. Grouped PRs qualify only via
      # the patch-only `dev-patch` group; per-dependency metadata on a mixed
      # group isn't a safe signal on its own.
      - name: Mint an App token for devDependency patch bumps only
        id: app-token
        if: >
          steps.meta.outputs.directory == '/' &&
          (
            steps.meta.outputs.dependency-group == 'dev-patch' ||
            (
              steps.meta.outputs.dependency-group == '' &&
              steps.meta.outputs.update-type == 'version-update:semver-patch' &&
              steps.meta.outputs.dependency-type == 'direct:development'
            )
          )
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write # the squash merge writes to main
          permission-pull-requests: write # set the auto-merge flag

      - name: Enable auto-merge
        if: steps.app-token.outcome == 'success'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
