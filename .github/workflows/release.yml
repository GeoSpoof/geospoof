name: Release

on:
  push:
    tags:
      - "v*"

# NOTE: This workflow releases the browser extension only (Firefox XPI + source,
# Chromium zip, and the self-hosted update manifest). The native macOS/iOS apps
# and their DMG live in the private geospoof-ios repo and release from there - do
# not re-add a DMG build here.

# Read-only by default; the release job escalates to exactly what it needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
      # No `pages: write`: the Firefox update manifest is served from
      # cdn.geospoof.com, a domain we own, rather than this repo's GitHub Pages.
      # Pages was retired ahead of transferring the repo to the GeoSpoof org,
      # because a repo's github.io path does not survive a transfer — see the
      # self-hosted update path section in .github/CONTRIBUTING.md.
      id-token: write # OIDC for the CDN publish + build provenance (Sigstore)
      attestations: write # record build provenance for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: cp .env.example .env

      - name: Extract version
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE_VERSION="${TAG#v}"
          echo "BASE_VERSION=${BASE_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Verify version match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version '$BASE_VERSION' does not match package.json version '$PKG_VERSION'" >&2
            exit 1
          fi

      # ── Build Firefox & package source ──
      - run: npm run package:xpi
      - run: npm run package:source

      # ── Save clean dist for AMO signing later ──
      - name: Backup dist for AMO
        run: cp -r dist dist-amo

      # ── Unlisted (self-hosted) signing ──
      - name: Inject build version for unlisted
        run: jq --arg v "$BUILD_VERSION" '.version = $v' dist/manifest.json > dist/manifest.tmp && mv dist/manifest.tmp dist/manifest.json

      - name: Sign XPI (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bash scripts/sign-xpi.sh --channel unlisted

      - name: Rename signed XPI
        run: |
          SIGNED=$(find web-ext-artifacts -name '*.xpi' ! -name "geospoof-firefox-v${BASE_VERSION}-unsigned.xpi" | head -1)
          if [ -n "$SIGNED" ]; then
            mv "$SIGNED" "web-ext-artifacts/geospoof-firefox-v${BASE_VERSION}-signed.xpi"
          fi

      # ── Listed (AMO) signing ──
      - name: Restore clean dist for AMO
        run: rm -rf dist && mv dist-amo dist

      - name: Strip update_url for AMO
        run: jq 'del(.browser_specific_settings.gecko.update_url)' dist/manifest.json > dist/manifest.tmp && mv dist/manifest.tmp dist/manifest.json

      - name: Sign XPI (listed/AMO)
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bash scripts/sign-xpi.sh --channel listed --source geospoof-source-v${BASE_VERSION}.zip

      # ── Chromium ──
      - name: Package Chromium
        run: npm run package:chromium

      # ── Update manifest for self-hosted Firefox auto-updates ──
      - name: Generate update manifest
        run: |
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/geospoof-firefox-v${BASE_VERSION}-signed.xpi"
          bash scripts/generate-update-manifest.sh "$BUILD_VERSION" "$DOWNLOAD_URL"

      # ── Collect release artifacts ──
      - name: Collect release artifacts
        run: |
          mkdir -p release-assets
          cp "web-ext-artifacts/geospoof-firefox-v${BASE_VERSION}-signed.xpi" release-assets/
          cp "web-ext-artifacts/geospoof-firefox-v${BASE_VERSION}-unsigned.xpi" release-assets/
          cp "web-ext-artifacts/geospoof-chromium-v${BASE_VERSION}.zip" release-assets/
          cp "geospoof-source-v${BASE_VERSION}.zip" release-assets/

      # ── Build provenance ──
      # Cryptographically attest that these artifacts were built by THIS workflow
      # from THIS repo at this commit, signed via Sigstore and recorded in GitHub's
      # attestation store. For a privacy/security extension this is a real trust
      # signal: anyone can run `gh attestation verify <file> --repo GeoSpoof/geospoof`
      # on a downloaded XPI and confirm it genuinely came from our CI, not a
      # tampered mirror. Must run after the artifacts exist and before/around the
      # release; attestation covers the exact bytes that get uploaded.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.2.0
        with:
          subject-path: "release-assets/*"

      # Attach the Sigstore provenance bundle to the release as an asset, in
      # addition to GitHub's attestation store. The attestation API already makes
      # this verifiable (`gh attestation verify ... --repo GeoSpoof/geospoof`), but
      # a downloadable `.intoto.jsonl` lets anyone verify offline without a GitHub
      # token, and is the form OpenSSF Scorecard's Signed-Releases check currently
      # reads (it does not yet credit the attestation store — ossf/scorecard#4667).
      # One bundle covers every artifact: the attestation lists them all as
      # subjects, each bound to its own digest.
      - name: Stage provenance bundle for release
        run: cp "${{ steps.attest.outputs.bundle-path }}" "release-assets/geospoof-v${BASE_VERSION}.intoto.jsonl"

      # ── Single GitHub Release with all artifacts ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ env.BASE_VERSION }}
          files: release-assets/*
          generate_release_notes: true

      # ── Update manifest: cdn.geospoof.com ──
      #
      # `update_url` is compiled into every shipped copy of the extension, and
      # Mozilla is explicit that an installed extension keeps polling the URL it
      # was built with — an existing install cannot be told about a new one. The
      # manifest is therefore served from cdn.geospoof.com, a domain we own, so
      # the update path does not depend on where this repo lives. (It was briefly
      # dual-published to this repo's GitHub Pages during the migration off that
      # path; Pages was retired because a github.io URL does not survive a repo
      # transfer. See .github/CONTRIBUTING.md, "Self-hosted update path".)
      #
      # Publishing AFTER the GitHub Release step is deliberate: the manifest's
      # `update_link` points at that release's assets, so publishing earlier would
      # briefly advertise a version whose download does not exist yet.
      #
      # No stored AWS credentials — this assumes an IAM role scoped to the
      # `firefox/` prefix via the `id-token: write` permission above. See
      # cdk/README.md, "Who may publish", before touching the role or its trust.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.EXT_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish update manifest to CDN
        env:
          BUCKET: ${{ vars.EXT_CDN_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.EXT_CDN_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          # max-age=300 matches gps/latest.json and is REQUIRED: the distribution's
          # default behaviour is CACHING_OPTIMIZED and honours the origin header, so
          # uploading this with the long immutable header used for versioned geo-tz
          # data would pin a stale version pointer at the edge for up to a year.
          aws s3 cp update.json "s3://${BUCKET}/firefox/update.json" \
            --cache-control "public, max-age=300" \
            --content-type "application/json"
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/firefox/update.json"

      - name: Verify both manifests agree
        run: |
          set -euo pipefail
          # A release that publishes two update manifests which disagree is worse
          # than one that publishes neither, so fail loudly here rather than let
          # half the installed base see a different version from the other half.
          # Compares the CDN copy against what was just generated.
          for attempt in 1 2 3 4 5; do
            if curl -fsS "https://cdn.geospoof.com/firefox/update.json" -o cdn-update.json; then
              break
            fi
            echo "CDN manifest not visible yet (attempt ${attempt}); retrying..."
            sleep 15
          done
          if ! diff -u update.json cdn-update.json; then
            echo "::error::CDN update manifest does not match the generated one"
            exit 1
          fi
          echo "CDN manifest matches the generated manifest"
