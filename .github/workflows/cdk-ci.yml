name: CDK CI

# The cdk/ app provisions the CloudFront + S3 stack that serves the geo-tz data,
# the GPS downloads, and the Firefox self-hosted update manifest. It lives in
# this repo but is NOT covered by the main CI workflow, so without this it would
# only ever be type-checked and tested at deploy time - meaning a broken synth or
# a wrong publish-role trust policy reaches `cdk diff` on a prod deploy instead of
# failing a PR. This workflow gives the infra the same PR-level gate as the
# extension code.
#
# Separate workflow (rather than a job in ci.yml) so the `paths` filter can keep
# it from running on PRs that do not touch cdk/ - a job cannot be path-filtered on
# its own, only a workflow trigger can.

on:
  pull_request:
    paths:
      - "cdk/**"
      - ".github/workflows/cdk-ci.yml"
  push:
    branches:
      - main
    paths:
      - "cdk/**"
      - ".github/workflows/cdk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdk:
    name: CDK lint, test, synth
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Checks that every installed package carries a valid npm registry
      # signature, so a tampered tarball fails CI.
      - name: Verify registry signatures
        run: npm audit signatures

      # build:full runs format:check + lint + test + tsc in one step, which is
      # exactly the PR gate we want. Kept as the single source of truth so CI and
      # the local pre-deploy check (deploy:prod depends on build:full) cannot
      # drift apart.
      - name: Format, lint, test, type-check
        run: npm run build:full
