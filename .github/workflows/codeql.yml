name: CodeQL

# Static analysis (SAST) for the extension's JavaScript/TypeScript. Runs on every
# PR and push to main so a newly introduced vulnerability fails review, plus a
# weekly scheduled scan so CodeQL's updated query packs re-examine code that has
# not changed (new rules catch old bugs).
#
# Committed as a workflow rather than enabled via GitHub's "default setup" on
# purpose: the configuration is then version-controlled and reviewed like any
# other change, and the actions are SHA-pinned to match this repo's standard.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Mondays 07:00 UTC — re-scan with the latest query packs.
    - cron: "0 7 * * 1"

# Least privilege: the analyze job escalates to security-events: write only where
# it needs to upload results. Everything else stays read-only.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          # One pack covers both JS and TS. `security-and-quality` is the broadest
          # query suite (security + maintainability); drop to `security-extended`
          # or `security` if quality findings prove too noisy to triage.
          languages: javascript-typescript
          # config-file scopes the scan to shipped code (src/**) and excludes test
          # fixtures + dev scripts whose findings are false by construction.
          config-file: ./.github/codeql/codeql-config.yml

      # No manual build step: JS/TS is analyzed directly from source, so CodeQL's
      # autobuild is unnecessary and we skip straight to analysis.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
