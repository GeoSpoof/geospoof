name: Manage Stale Issues and PRs

on:
  push:
    paths:
      - .github/workflows/stale.yml
    branches-ignore:
      - dependabot/**
  schedule:
    # Once every day at midnight UTC. Each run also removes the stale label
    # from anything commented on since it was marked, so no issue_comment
    # trigger is needed (zizmor flags it as a dangerous trigger).
    - cron: "0 0 * * *"

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: stale-issues
  cancel-in-progress: true

jobs:
  stale:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Mark/Close Stale Issues and Pull Requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed if no further activity
            occurs.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed if no further
            activity occurs.
          exempt-issue-labels: "keep-open"
          exempt-pr-labels: "keep-open"
          delete-branch: true
